<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page - De Wireframe a Producción</title>
    <style>
        /* ==========================================================================
           1. VARIABLES DE COLOR (Asignadas según la paleta de referencia)
           ========================================================================== */
        :root {
            --lavender-veil: #F2D7EE;   /* Fondo general / Luminoso y suave */
            --thistle: #D3BCC0;         /* Tono neutro / Sombras suaves y sub-elementos */
            --dusty-lavender: #A5668B;  /* Color de realce / Subtítulos y efectos decorativos */
            --velvet-purple: #69306D;   /* Color dominante / Títulos y botones con carácter */
            --deep-navy: #0E103D;       /* Color de contraste / Textos densos y bordes definidos */
            --white: #ffffff;
        }

        /* RESET GENERAL: Limpieza de márgenes por defecto */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--lavender-veil);
            color: var(--deep-navy);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ==========================================================================
           2. ENCABEZADO / NAVEGACIÓN (Navbar estructurado con tablas estables)
           ========================================================================== */
        .navbar {
            display: block;
            width: 100%;
            padding: 25px 40px;
            background-color: transparent;
        }

        .navbar-container {
            display: table;
            width: 100%;
        }

        /* Bloque del Logo (Izquierda) */
        .nav-logo-cell {
            display: table-cell;
            vertical-align: middle;
            width: 20%;
        }

        .logo-container {
            display: inline-block;
            vertical-align: middle;
        }

        .logo-circle {
            width: 22px;
            height: 22px;
            border: 2.5px solid var(--deep-navy);
            border-radius: 50%;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            color: var(--deep-navy);
            display: inline-block;
            vertical-align: middle;
            letter-spacing: -0.5px;
        }

        /* Menú Central (Enlaces) */
        .nav-links-cell {
            display: table-cell;
            vertical-align: middle;
            text-align: center;
            width: 45%;
        }

        .nav-menu {
            list-style: none;
            display: inline-block;
        }

        .nav-item {
            display: inline-block;
            margin: 0 16px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--deep-navy);
            font-weight: 600;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: var(--velvet-purple);
        }

        /* Corazón estilizado al lado del enlace 'Pages' del boceto */
        .nav-link.pages::after {
            content: " ♥";
            font-size: 11px;
            color: var(--dusty-lavender);
        }

        /* Bloque de Acciones (Derecha: Buscador e Icono Nocturno) */
        .nav-actions-cell {
            display: table-cell;
            vertical-align: middle;
            text-align: right;
            width: 35%;
        }

        .search-box {
            display: inline-block;
            vertical-align: middle;
            border: 2px solid var(--deep-navy);
            border-radius: 6px;
            background-color: var(--white);
            overflow: hidden;
            margin-right: 15px;
        }

        .search-input {
            border: none;
            padding: 8px 12px;
            font-size: 13px;
            outline: none;
            color: var(--deep-navy);
            width: 150px;
            background-color: transparent;
        }

        .search-button {
            background-color: transparent;
            border: none;
            border-left: 2px solid var(--deep-navy);
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: var(--deep-navy);
            transition: background-color 0.3s;
        }

        .search-button:hover {
            background-color: var(--thistle);
        }

        .theme-toggle {
            display: inline-block;
            vertical-align: middle;
            cursor: pointer;
            font-size: 18px;
            color: var(--deep-navy);
            transition: transform 0.2s;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        /* ==========================================================================
           3. HERO SECTION (Sección Principal de Contenido)
           ========================================================================== */
        .hero-section {
            display: table;
            width: 100%;
            table-layout: fixed;
            padding: 60px 60px 140px 60px;
            position: relative;
            z-index: 2; /* Por encima de las ondas decorativas de fondo */
        }

        /* Columna del Texto (Izquierda) */
        .hero-text-column {
            display: table-cell;
            width: 50%;
            vertical-align: middle;
            padding-right: 40px;
        }

        .hero-subtitle {
            font-size: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--dusty-lavender);
            margin-bottom: 8px;
        }

        .hero-title {
            font-size: 68px;
            font-weight: 800;
            line-height: 1.1;
            color: var(--velvet-purple);
            margin-bottom: 35px;
            text-transform: uppercase;
        }

        /* Botón 'View More' con estilo de elevación sólida */
        .btn-view-more {
            display: inline-block;
            padding: 14px 34px;
            border: 2.5px solid var(--deep-navy);
            background-color: var(--white);
            color: var(--deep-navy);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            border-radius: 6px;
            box-shadow: 4px 4px 0px var(--deep-navy);
            transition: all 0.2s ease;
        }

        .btn-view-more:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--velvet-purple);
            border-color: var(--velvet-purple);
            color: var(--velvet-purple);
        }

        /* Columna de la Imagen (Derecha) */
        .hero-media-column {
            display: table-cell;
            width: 50%;
            vertical-align: middle;
            text-align: center;
        }

        /* Recuadro contenedor que emula la "X" del Wireframe */
        .media-placeholder {
            width: 100%;
            max-width: 540px;
            height: 330px;
            border: 3px solid var(--deep-navy);
            background-color: var(--white);
            position: relative;
            display: inline-block;
            box-shadow: 8px 8px 0px var(--thistle);
            border-radius: 8px;
        }

        /* Trazo de las líneas cruzadas diagonales */
        .media-placeholder::before,
        .media-placeholder::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .media-placeholder::before {
            background: linear-gradient(to top right, transparent calc(50% - 1.5px), var(--thistle) calc(50% - 1px), var(--thistle) calc(50% + 1px), transparent calc(50% + 1.5px));
        }

        .media-placeholder::after {
            background: linear-gradient(to bottom right, transparent calc(50% - 1.5px), var(--thistle) calc(50% - 1px), var(--thistle) calc(50% + 1px), transparent calc(50% + 1.5px));
        }

        /* ==========================================================================
           4. CAPA INFERIOR: ONDA DE FONDO Y CONTROLES
           ========================================================================== */
        /* Contenedor de la línea ondulada inferior */
        .footer-wave-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 180px;
            z-index: 1;
            overflow: hidden;
        }

        .wave-svg {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
        }

        /* Controles posicionados sobre las ondas */
        .controls-layer {
            position: absolute;
            bottom: 35px;
            left: 0;
            width: 100%;
            padding: 0 40px;
            z-index: 3;
        }

        .controls-table {
            display: table;
            width: 100%;
        }

        /* Puntos de paginación (Izquierda) */
        .pagination-cell {
            display: table-cell;
            vertical-align: middle;
            text-align: left;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 9px;
            background-color: var(--deep-navy);
            opacity: 0.3;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.3s;
        }

        /* Primer punto activo vacío y el segundo lleno como figura en el wireframe */
        .dot.active {
            opacity: 1;
            background-color: var(--deep-navy);
            transform: scale(1.1);
        }

        .dot.outline {
            opacity: 1;
            background-color: transparent;
            border: 2px solid var(--deep-navy);
        }

        /* Flechas del control deslizante (Derecha) */
        .arrows-cell {
            display: table-cell;
            vertical-align: middle;
            text-align: right;
        }

        .arrow-btn {
            width: 44px;
            height: 44px;
            border: 2px solid var(--deep-navy);
            border-radius: 50%;
            background-color: var(--white);
            color: var(--deep-navy);
            display: inline-block;
            text-align: center;
            line-height: 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 12px;
            user-select: none;
            transition: all 0.2s ease;
            box-shadow: 2px 2px 0px var(--deep-navy);
        }

        .arrow-btn:hover {
            background-color: var(--velvet-purple);
            color: var(--white);
            border-color: var(--velvet-purple);
            transform: translateY(-2px);
        }

        /* ==========================================================================
           5. RESPONSIVE DESIGN (Adaptación para Tablets y Celulares)
           ========================================================================== */
        @media (max-width: 768px) {
            .navbar-container, .hero-section, .controls-table {
                display: block;
            }
            .nav-logo-cell, .nav-links-cell, .nav-actions-cell,
            .hero-text-column, .hero-media-column,
            .pagination-cell, .arrows-cell {
                display: block;
                width: 100%;
                text-align: center;
                margin-bottom: 25px;
                padding-right: 0;
            }
            .hero-title {
                font-size: 46px;
            }
            .media-placeholder {
                height: 250px;
            }
            .search-box {
                margin-right: 0;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-container">
            <div class="nav-logo-cell">
                <div class="logo-container">
                    <div class="logo-circle"></div>
                    <span class="logo-text">Logo</span>
                </div>
            </div>
            
            <div class="nav-links-cell">
                <ul class="nav-menu">
                    <li class="nav-item"><a href="#" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">About</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Services</a></li>
                    <li class="nav-item"><a href="#" class="nav-link pages">Pages</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Contact</a></li>
                </ul>
            </div>
            
            <div class="nav-actions-cell">
                <div class="search-box">
                    <input type="text" class="search-input" placeholder="Enter Keyword...">
                    <button class="search-button">Search</button>
                </div>
                <div class="theme-toggle" title="Modo Oscuro">🌙</div>
            </div>
        </div>
    </nav>

    <main class="hero-section">
        <div class="hero-text-column">
            <p class="hero-subtitle">Subtitulo</p>
            <h1 class="hero-title">TITULO</h1>
            <a href="#" class="btn-view-more">View More</a>
        </div>
        
        <div class="hero-media-column">
            <div class="media-placeholder">
                </div>
        </div>
    </main>

    <div class="footer-wave-container">
        <svg class="wave-svg" viewBox="0 0 1440 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0,70 C360,180 720,20 1080,130 C1260,180 1380,140 1440,105 L1440,200 L0,200 Z" 
                  fill="#D3BCC0" opacity="0.4"/>
            <path d="M0,100 C320,210 680,40 1040,150 C1220,200 1350,150 1440,120 L1440,200 L0,200 Z" 
                  fill="#A5668B"/>
        </svg>
    </div>

    <div class="controls-layer">
        <div class="controls-table">
            <div class="pagination-cell">
                <span class="dot outline"></span> <span class="dot active"></span>  <span class="dot active"></span>
                <span class="dot active"></span>
            </div>
            
            <div class="arrows-cell">
                <span class="arrow-btn">‹</span>
                <span class="arrow-btn">›</span>
            </div>
        </div>
    </div>

</body>
</html>
