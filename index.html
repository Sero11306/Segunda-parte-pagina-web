<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page - Video de Fondo con Control de Audio</title>
    <style>
        /* ==========================================================================
           1. VARIABLES DE COLOR
           ========================================================================== */
        :root {
            --lavender-veil: #F2D7EE;   
            --thistle: #D3BCC0;         
            --dusty-lavender: #A5668B;  
            --velvet-purple: #69306D;   
            --deep-navy: #0E103D;       
            --white: #ffffff;
        }

        /* RESET GENERAL */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            color: var(--deep-navy);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background-color: #000;
        }

        /* ==========================================================================
           VIDEO DE FONDO (Optimizado para Autoplay con Audio Controlado)
           ========================================================================== */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* Capa de contraste */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(242, 215, 238, 0.35); 
            z-index: 0;
            pointer-events: none;
        }

        /* ==========================================================================
           2. ENCABEZADO / NAVEGACIÓN (Navbar)
           ========================================================================== */
        .navbar {
            display: block;
            width: 100%;
            padding: 25px 40px;
            background-color: transparent;
            position: relative;
            z-index: 10;
        }

        .navbar-container {
            display: table;
            width: 100%;
        }

        .nav-logo-cell {
            display: table-cell;
            vertical-align: middle;
            width: 20%;
        }

        .logo-circle {
            width: 22px;
            height: 22px;
            border: 2.5px solid var(--deep-navy);
            border-radius: 50%;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
            background-color: var(--white);
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            color: var(--deep-navy);
            display: inline-block;
            vertical-align: middle;
            letter-spacing: -0.5px;
        }

        .nav-links-cell {
            display: table-cell;
            vertical-align: middle;
            text-align: center;
            width: 45%;
        }

        .nav-menu {
            list-style: none;
            display: inline-block;
        }

        .nav-item {
            display: inline-block;
            margin: 0 16px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--deep-navy);
            font-weight: 600;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: var(--velvet-purple);
        }

        .nav-link.pages::after {
            content: " ♥";
            font-size: 11px;
            color: var(--velvet-purple);
        }

        .nav-actions-cell {
            display: table-cell;
            vertical-align: middle;
            text-align: right;
            width: 35%;
        }

        .search-box {
            display: inline-block;
            vertical-align: middle;
            border: 2px solid var(--deep-navy);
            border-radius: 6px;
            background-color: var(--white);
            overflow: hidden;
            margin-right: 15px;
        }

        .search-input {
            border: none;
            padding: 8px 12px;
            font-size: 13px;
            outline: none;
            color: var(--deep-navy);
            width: 150px;
            background-color: transparent;
        }

        .search-button {
            background-color: transparent;
            border: none;
            border-left: 2px solid var(--deep-navy);
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: var(--deep-navy);
        }

        .theme-toggle {
            display: inline-block;
            vertical-align: middle;
            cursor: pointer;
            font-size: 18px;
            color: var(--deep-navy);
        }

        /* ==========================================================================
           3. HERO SECTION
           ========================================================================== */
        .hero-section {
            display: table;
            width: 100%;
            table-layout: fixed;
            padding: 60px 60px 140px 60px;
            position: relative;
            z-index: 5;
        }

        .hero-text-column {
            display: table-cell;
            width: 50%;
            vertical-align: middle;
            padding-right: 40px;
        }

        .hero-subtitle {
            font-size: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--velvet-purple);
            margin-bottom: 8px;
            text-shadow: 1px 1px 1px rgba(255,255,255,0.6);
        }

        .hero-title {
            font-size: 68px;
            font-weight: 800;
            line-height: 1.1;
            color: var(--deep-navy);
            margin-bottom: 35px;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.4);
        }

        .btn-view-more {
            display: inline-block;
            padding: 14px 34px;
            border: 2.5px solid var(--deep-navy);
            background-color: var(--white);
            color: var(--deep-navy);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            border-radius: 6px;
            box-shadow: 4px 4px 0px var(--deep-navy);
            transition: all 0.2s ease;
        }

        .btn-view-more:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--velvet-purple);
            border-color: var(--velvet-purple);
        }

        .hero-media-column {
            display: table-cell;
            width: 50%;
            vertical-align: middle;
            text-align: center;
        }

        .media-placeholder {
            width: 100%;
            max-width: 540px;
            height: 330px;
            border: 3px solid var(--deep-navy);
            background-color: rgba(255, 255, 255, 0.75);
            position: relative;
            display: inline-block;
            box-shadow: 8px 8px 0px var(--velvet-purple);
            border-radius: 8px;
        }

        /* ==========================================================================
           4. CAPA INFERIOR: ONDA DE FONDO Y CONTROLES
           ========================================================================== */
        .footer-wave-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 180px;
            z-index: 2;
            overflow: hidden;
        }

        .wave-svg {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
        }

        .controls-layer {
            position: absolute;
            bottom: 35px;
            left: 0;
            width: 100%;
            padding: 0 40px;
            z-index: 6;
        }

        .controls-table {
            display: table;
            width: 100%;
        }

        .pagination-cell {
            display: table-cell;
            vertical-align: middle;
            text-align: left;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 9px;
            background-color: var(--deep-navy);
            opacity: 0.4;
        }

        .dot.active { opacity: 1; background-color: var(--deep-navy); }
        .dot.outline { opacity: 1; background-color: transparent; border: 2px solid var(--deep-navy); }

        /* Contenedor derecho que agrupa flechas y el nuevo botón de audio */
        .arrows-cell {
            display: table-cell;
            vertical-align: middle;
            text-align: right;
        }

        .arrow-btn {
            width: 44px;
            height: 44px;
            border: 2px solid var(--deep-navy);
            border-radius: 50%;
            background-color: var(--white);
            color: var(--deep-navy);
            display: inline-block;
            text-align: center;
            line-height: 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 12px;
            box-shadow: 2px 2px 0px var(--deep-navy);
            transition: all 0.2s ease;
        }

        .arrow-btn:hover {
            background-color: var(--velvet-purple);
            color: var(--white);
            border-color: var(--velvet-purple);
            transform: translateY(-2px);
        }

        /* COMPONENTE INTERACTIVO: Botón de Audio minimalista */
        .audio-control-btn {
            width: 44px;
            height: 44px;
            border: 2px solid var(--deep-navy);
            border-radius: 50%;
            background-color: var(--white);
            color: var(--deep-navy);
            display: inline-block;
            text-align: center;
            line-height: 40px;
            font-size: 16px;
            cursor: pointer;
            margin-left: 24px; /* Separación intencional de las flechas */
            box-shadow: 2px 2px 0px var(--deep-navy);
            transition: all 0.2s ease;
            user-select: none;
        }

        .audio-control-btn:hover {
            background-color: var(--dusty-lavender);
            color: var(--white);
            transform: translateY(-2px);
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 768px) {
            .navbar-container, .hero-section, .controls-table { display: block; }
            .nav-logo-cell, .nav-links-cell, .nav-actions-cell,
            .hero-text-column, .hero-media-column, .pagination-cell, .arrows-cell {
                display: block; width: 100%; text-align: center; margin-bottom: 25px; padding-right: 0;
            }
            .hero-title { font-size: 42px; }
            .media-placeholder { height: 240px; }
            .audio-control-btn { margin-left: 12px; margin-top: 15px; }
        }
    </style>
</head>
<body>

    <video id="bgVideo" class="video-background" autoplay muted loop playsinline>
        <source src="ryan.mp4" type="video/mp4">
        Tu navegador no soporta videos en formato MP4.
    </video>

    <div class="video-overlay"></div>

    <nav class="navbar">
        <div class="navbar-container">
            <div class="nav-logo-cell">
                <div class="logo-container">
                    <div class="logo-circle"></div>
                    <span class="logo-text">Logo</span>
                </div>
            </div>
            <div class="nav-links-cell">
                <ul class="nav-menu">
                    <li class="nav-item"><a href="#" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">About</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Services</a></li>
                    <li class="nav-item"><a href="#" class="nav-link pages">Pages</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Contact</a></li>
                </ul>
            </div>
            <div class="nav-actions-cell">
                <div class="search-box">
                    <input type="text" class="search-input" placeholder="Enter Keyword...">
                    <button class="search-button">Search</button>
                </div>
                <div class="theme-toggle">🌙</div>
            </div>
        </div>
    </nav>

    <main class="hero-section">
        <div class="hero-text-column">
            <p class="hero-subtitle">Subtitulo</p>
            <h1 class="hero-title">TITULO</h1>
            <a href="#" class="btn-view-more">View More</a>
        </div>
        <div class="hero-media-column">
            <div class="media-placeholder">
                </div>
        </div>
    </main>

    <div class="footer-wave-container">
        <svg class="wave-svg" viewBox="0 0 1440 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0,70 C360,180 720,20 1080,130 C1260,180 1380,140 1440,105 L1440,200 L0,200 Z" fill="#D3BCC0" opacity="0.4"/>
            <path d="M0,100 C320,210 680,40 1040,150 C1220,200 1350,150 1440,120 L1440,200 L0,200 Z" fill="#A5668B"/>
        </svg>
    </div>

    <div class="controls-layer">
        <div class="controls-table">
            <div class="pagination-cell">
                <span class="dot outline"></span>
                <span class="dot active"></span>
                <span class="dot active"></span>
                <span class="dot active"></span>
            </div>
            
            <div class="arrows-cell">
                <span class="arrow-btn">‹</span>
                <span class="arrow-btn">›</span>
                
                <span id="audioBtn" class="audio-control-btn" title="Activar Sonido">🔇</span>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('bgVideo');
        const audioBtn = document.getElementById('audioBtn');

        audioBtn.addEventListener('click', function() {
            if (video.muted) {
                video.muted = false;
                audioBtn.innerHTML = '🔊';
                audioBtn.setAttribute('title', 'Silenciar Video');
            } else {
                video.muted = true;
                audioBtn.innerHTML = '🔇';
                audioBtn.setAttribute('title', 'Activar Sonido');
            }
        });
    </script>
</body>
</html>
